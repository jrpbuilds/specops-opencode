name: Bug Report
description: Report a problem with SpecOps.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to file a bug report. Please include as much detail as you can so we can reproduce the issue.
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: A clear and concise description of the bug.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          description: Minimal steps that consistently trigger the issue.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: What did you expect?
          description: What should have happened instead?
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: What actually happened?
          description: Error messages, unexpected output, or other observed behaviour.
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Versions of Bun, OpenSpec, OpenCode, the SpecOps plugin, and your operating system.
      validations:
          required: false
