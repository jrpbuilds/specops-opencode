name: OpenCode 2 migration

on:
    push:
        branches:
            - beta
    pull_request:
        branches:
            - beta

concurrency:
    group: opencode2-migration-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - name: Install pinned dependencies
              run: bun install --frozen-lockfile
            - name: Check OpenCode 2 migration contract
              run: bun run check:v2
            - name: Install current OpenCode 2 beta CLI
              run: npm install --global @opencode-ai/cli@beta
            - name: Show OpenCode 2 version
              run: opencode2 --version
            - name: Run real OpenCode 2 plugin smoke
              run: bun run test:runtime:v2
