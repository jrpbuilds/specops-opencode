name: OpenCode 2 migration

on:
    push:
        branches:
            - beta

permissions:
    contents: write

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out beta
              uses: actions/checkout@v4
              with:
                  ref: beta
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - name: Resolve pinned OpenCode 2 dependencies
              run: bun install
            - name: Snapshot pinned plugin type contract
              run: |
                  rm -rf .migration/opencode-plugin-contract
                  mkdir -p .migration/opencode-plugin-contract
                  cp node_modules/@opencode-ai/plugin/package.json .migration/opencode-plugin-contract/package.json
                  find -L node_modules/@opencode-ai/plugin/dist -type f -name '*.d.ts' -print0 | while IFS= read -r -d '' file; do
                      rel="${file#node_modules/@opencode-ai/plugin/}"
                      mkdir -p ".migration/opencode-plugin-contract/$(dirname "$rel")"
                      cp "$file" ".migration/opencode-plugin-contract/$rel"
                  done
            - name: Commit resolved lock and contract when changed
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add bun.lock .migration/opencode-plugin-contract
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git commit -m "chore(beta): resolve pinned OpenCode 2 contract"
                  git push origin HEAD:beta
