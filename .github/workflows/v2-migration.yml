name: OpenCode 2 migration

on:
    push:
        branches:
            - beta
    pull_request:
        branches:
            - beta

concurrency:
    group: opencode2-migration-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - name: Install pinned dependencies
              run: bun install --frozen-lockfile
            - name: Check OpenCode 2 host integration
              run: bun run check:v2-host
