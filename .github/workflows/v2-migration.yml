name: OpenCode 2 migration

on:
    push:
        branches:
            - beta

permissions:
    contents: write

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out beta
              uses: actions/checkout@v4
              with:
                  ref: beta
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - name: Install pinned dependencies
              run: bun install --frozen-lockfile
            - name: Check V2 server phase
              id: phase
              continue-on-error: true
              run: |
                  set -o pipefail
                  bun run check:v2-server 2>&1 | tee .migration/ci-server.log
            - name: Commit failure log for inspection
              if: steps.phase.outcome == 'failure' && github.actor != 'github-actions[bot]'
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add .migration/ci-server.log
                  git commit -m "ci(beta): capture V2 server failure" || exit 0
                  git push origin HEAD:beta
            - name: Fail when V2 server gate failed
              if: steps.phase.outcome == 'failure'
              run: exit 1
