<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SpecOps Examples</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: #000;
                color: #eafcff;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
                    sans-serif;
            }
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            main {
                max-width: 480px;
                padding: 32px 24px;
                text-align: center;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 28px;
                letter-spacing: 1px;
            }
            p.subtitle {
                margin: 0 0 32px;
                color: #7ff4ff;
            }
            ul {
                list-style: none;
                margin: 0;
                padding: 0;
            }
            a {
                display: block;
                padding: 16px 20px;
                margin: 8px 0;
                border: 1px solid #35c8ff;
                border-radius: 8px;
                color: #eafcff;
                text-decoration: none;
                transition:
                    background 0.15s ease,
                    transform 0.15s ease;
            }
            a:hover {
                background: #0b2433;
                transform: translateY(-1px);
            }
            a .name {
                font-size: 18px;
                font-weight: 600;
            }
            a .desc {
                display: block;
                margin-top: 4px;
                font-size: 13px;
                color: #7ff4ff;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>SpecOps Examples</h1>
            <p class="subtitle">Games and demos generated through the SpecOps workflow</p>
            <ul>
                <li>
                    <a href="galaxy-shooter/">
                        <span class="name">Galaxy Shooter</span>
                        <span class="desc">Polished vertical arcade shooter</span>
                    </a>
                </li>
            </ul>
        </main>
    </body>
</html>
