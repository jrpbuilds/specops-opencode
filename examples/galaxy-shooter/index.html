<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Galaxy Shooter</title>
  <style>
    :root { background: #050512; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #050512; overscroll-behavior: none;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      touch-action: none; user-select: none;
    }
    canvas {
      display: block; width: 400px; height: 700px;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
<canvas id="game" width="400" height="700"></canvas>
<script>
(() => {
  'use strict';

  // == 1. Config (CFG) ==
  const CFG = {
    W: 400, H: 700, maxDpr: 2,
    player: { x: 200, y: 600, r: 12, minX: 24, maxX: 376, minY: 380, maxY: 664, speed: 320, accel: 2600, brake: 3000, autoCd: 0.16, rapidCd: 0.09, manualCd: 0.12 },
    pools: { bullets: 64, eBullets: 96, enemies: 48, powerUps: 12, particles: 512, floatTexts: 24 },
    enemy: { basicFire: 2.2, eliteFire: 1.6, spawnAnim: 0.45 },
    colors: { bg0: '#050512', bg1: '#0a0a1e', cyan: '#4dd8ff', pale: '#aef7ff', white: '#ffffff', orange: '#ff7b43', gold: '#ffaa22', magenta: '#ff33cc', enemyShot: '#ff4da6', smoke: '#536080', hud: '#99ddff' },
    hitstop: { standard: 0.035, elite: 0.12, player: 0.09, bomb: 0.14, death: 0.30 },
    shake: { standard: 0.12, elite: 0.45, player: 0.5, bomb: 0.6, death: 0.8 }
  };

  // == 2. Math utils ==
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const approach = (v, target, amount) => v < target ? Math.min(v + amount, target) : Math.max(v - amount, target);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
  const hit = (a, b, r) => dist2(a, b) < (a.r + b.r + r) * (a.r + b.r + r);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const fmt = n => String(Math.max(0, n | 0)).padStart(6, '0');

  // == 3. Canvas & scaling ==
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  let dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDpr);
    canvas.width = CFG.W * dpr; canvas.height = CFG.H * dpr;
    const scale = Math.min(window.innerWidth / CFG.W, window.innerHeight / CFG.H);
    canvas.style.width = `${CFG.W * scale}px`; canvas.style.height = `${CFG.H * scale}px`;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();
  const logicalPoint = touch => {
    const rect = canvas.getBoundingClientRect();
    return { x: (touch.clientX - rect.left) * CFG.W / rect.width, y: (touch.clientY - rect.top) * CFG.H / rect.height };
  };

  // == 4. Input ==
  const input = { left: false, right: false, up: false, down: false, fireHeld: false, touchActive: false, touchX: 200, touchY: 600, fireQueued: 0 };
  let touchStart = null;
  const movementKeys = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down' };
  function clearInput() {
    input.left = input.right = input.up = input.down = input.fireHeld = input.touchActive = false;
    input.fireQueued = 0; touchStart = null;
  }
  function screenAdvance() {
    if (state === STATES.START || state === STATES.GAME_OVER) beginTransition(STATES.PLAYING);
  }
  window.addEventListener('keydown', e => {
    if (movementKeys[e.code]) { input[movementKeys[e.code]] = true; e.preventDefault(); }
    if (e.code === 'Space') {
      input.fireHeld = true; input.fireQueued++;
      e.preventDefault();
      if (state === STATES.START || state === STATES.GAME_OVER) screenAdvance();
    }
    if (e.code === 'Enter') { e.preventDefault(); if (state === STATES.START || state === STATES.GAME_OVER) screenAdvance(); }
  });
  window.addEventListener('keyup', e => {
    if (movementKeys[e.code]) { input[movementKeys[e.code]] = false; e.preventDefault(); }
    if (e.code === 'Space') { input.fireHeld = false; e.preventDefault(); }
  });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!e.changedTouches.length) return;
    const p = logicalPoint(e.changedTouches[0]);
    touchStart = { x: p.x, y: p.y, time: clock };
    input.touchActive = true; input.touchX = p.x; input.touchY = p.y;
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!e.touches.length) return;
    const p = logicalPoint(e.touches[0]); input.touchActive = true; input.touchX = p.x; input.touchY = p.y;
  }, { passive: false });
  function touchEnd(e) {
    e.preventDefault();
    if (!touchStart || !e.changedTouches.length) { input.touchActive = false; return; }
    const p = logicalPoint(e.changedTouches[0]);
    const moved = Math.hypot(p.x - touchStart.x, p.y - touchStart.y);
    if (clock - touchStart.time <= 0.25 && moved <= 12) {
      if (state === STATES.PLAYING) input.fireQueued++;
      else screenAdvance();
    }
    input.touchActive = false; touchStart = null;
  }
  canvas.addEventListener('touchend', touchEnd, { passive: false });
  canvas.addEventListener('touchcancel', touchEnd, { passive: false });

  // == 5. Entity pools ==
  const makePool = (size, factory) => { const p = []; for (let i = 0; i < size; i++) p.push(factory()); return p; };
  const bullets = makePool(CFG.pools.bullets, () => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, r: 4, dmg: 1 }));
  const eBullets = makePool(CFG.pools.eBullets, () => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, r: 5 }));
  const enemies = makePool(CFG.pools.enemies, () => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, hp: 1, maxHp: 1, type: 0, t: 0, spawnT: 0, fireT: 0, flashT: 0, r: 12, score: 100, baseX: 0, targetY: 100, delay: 0, diveX: 200 }));
  const powerUps = makePool(CFG.pools.powerUps, () => ({ active: false, x: 0, y: 0, vy: 60, type: 0, t: 0, r: 12, life: 9, vx: 0 }));
  const particles = makePool(CFG.pools.particles, () => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 1, drag: 0, color: CFG.colors.cyan, kind: 0, seed: 0 }));
  const floatTexts = makePool(CFG.pools.floatTexts, () => ({ active: false, x: 0, y: 0, vy: -40, life: 0, maxLife: 0.8, str: '', size: 16, color: CFG.colors.white, scale: 1 }));
  let particleCursor = 0;
  const alloc = pool => { for (let i = 0; i < pool.length; i++) if (!pool[i].active) return pool[i]; return null; };
  const deactivateAll = pool => { for (let i = 0; i < pool.length; i++) pool[i].active = false; };
  function spawnParticle(x, y, vx, vy, life, size, color, kind, drag) {
    const p = particles[particleCursor]; particleCursor = (particleCursor + 1) % particles.length;
    p.active = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.maxLife = life; p.size = size; p.color = color; p.kind = kind; p.drag = drag || 0; p.seed = Math.random() * 10;
  }
  function spawnText(x, y, str, color, size) {
    const f = alloc(floatTexts); if (!f) return;
    f.active = true; f.x = x; f.y = y; f.vy = -40; f.life = f.maxLife = 0.8; f.str = str; f.color = color; f.size = size || 16; f.scale = 1.25;
  }

  // == 6. Player ==
  const player = { x: 200, y: 600, vx: 0, vy: 0, tvx: 0, tvy: 0, w: 28, h: 30, alive: true, lives: 3, invulnT: 0, shield: false, fireCd: 0, manualCd: 0, recoilT: 0, flashT: 0, engineT: 0, spreadLv: 0, rapidT: 0, pickupT: 0, pickupColor: CFG.colors.cyan, r: 12 };
  function resetPlayer() {
    player.x = CFG.player.x; player.y = CFG.player.y; player.vx = player.vy = player.tvx = player.tvy = 0;
    player.alive = true; player.lives = 3; player.invulnT = 0; player.shield = false; player.fireCd = 0; player.manualCd = 0;
    player.recoilT = 0; player.flashT = 0; player.engineT = 0; player.spreadLv = 0; player.rapidT = 0; player.pickupT = 0;
  }
  function firePlayer() {
    if (!player.alive) return;
    const count = player.spreadLv ? 3 : 1;
    for (let i = 0; i < count; i++) {
      const b = alloc(bullets); if (!b) break;
      const angle = count === 1 ? 0 : (i - 1) * Math.PI / 18;
      b.active = true; b.x = player.x + Math.sin(angle) * 5; b.y = player.y - 18; b.vx = Math.sin(angle) * 560; b.vy = -Math.cos(angle) * 560; b.r = 4; b.dmg = 1;
    }
    player.recoilT = 0.09; player.vy += 40; player.fireCd = player.rapidT > 0 ? CFG.player.rapidCd : CFG.player.autoCd;
    spawnParticle(player.x, player.y - 19, 0, -20, 0.08, 5, CFG.colors.pale, 3, 0);
  }
  function updatePlayer(dt) {
    if (!player.alive) return;
    let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    if (input.touchActive) { player.tvx = clamp((input.touchX - player.x) * 12, -360, 360); player.tvy = clamp((input.touchY - player.y) * 12, -360, 360); }
    else { player.tvx = dx * CFG.player.speed; player.tvy = dy * CFG.player.speed; }
    player.vx = approach(player.vx, player.tvx, (dx || input.touchActive ? CFG.player.accel : CFG.player.brake) * dt);
    player.vy = approach(player.vy, player.tvy, (dy || input.touchActive ? CFG.player.accel : CFG.player.brake) * dt);
    player.x = clamp(player.x + player.vx * dt, CFG.player.minX, CFG.player.maxX);
    player.y = clamp(player.y + player.vy * dt, CFG.player.minY, CFG.player.maxY);
    player.engineT += dt; player.invulnT = Math.max(0, player.invulnT - dt); player.flashT = Math.max(0, player.flashT - dt);
    player.recoilT = Math.max(0, player.recoilT - dt); player.rapidT = Math.max(0, player.rapidT - dt); player.pickupT = Math.max(0, player.pickupT - dt);
    player.fireCd -= dt; player.manualCd -= dt;
    while (player.fireCd <= 0) { firePlayer(); if (!player.alive) break; }
    if (input.fireQueued > 0 && player.manualCd <= 0) { input.fireQueued--; player.manualCd = CFG.player.manualCd; firePlayer(); }
  }
  function drawPlayer() {
    if (!player.alive || (player.invulnT > 0 && ((player.invulnT * 60) | 0) % 2 === 0)) return;
    const recoil = player.recoilT > 0 ? easeOut(player.recoilT / 0.09) * 4 : 0;
    const bank = clamp(player.vx / 320, -1, 1) * 0.1;
    ctx.save(); ctx.translate(player.x, player.y + recoil); ctx.rotate(bank);
    const flick = 6 + 3 * Math.sin(player.engineT * 40);
    ctx.globalCompositeOperation = 'lighter'; ctx.shadowColor = CFG.colors.cyan; ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(77,216,255,.26)'; ctx.beginPath(); ctx.moveTo(-11, 12); ctx.lineTo(-4, 12 + flick); ctx.lineTo(0, 12); ctx.lineTo(4, 12 + flick); ctx.lineTo(11, 12); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0, -18, 0, 16); g.addColorStop(0, '#4db8ff'); g.addColorStop(0.55, '#1261c7'); g.addColorStop(1, '#0a245f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(14, 13); ctx.lineTo(5, 10); ctx.lineTo(0, 16); ctx.lineTo(-5, 10); ctx.lineTo(-14, 13); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(77,216,255,.35)'; ctx.lineWidth = 5; ctx.stroke(); ctx.strokeStyle = CFG.colors.pale; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = player.flashT > 0 ? '#fff' : '#b7f6ff'; ctx.beginPath(); ctx.arc(0, -6, 3, 0, Math.PI * 2); ctx.fill();
    if (player.shield) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(77,240,255,${0.45 + Math.sin(clock * 7) * 0.1})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 21 + Math.sin(clock * 5), 0, Math.PI * 2); ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
    if (player.pickupT > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = player.pickupColor; ctx.lineWidth = 3; ctx.globalAlpha = player.pickupT / 0.15; ctx.beginPath(); ctx.arc(0, 0, 24 + (0.15 - player.pickupT) * 100, 0, Math.PI * 2); ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
    ctx.restore();
  }

  // == 7. Spawner / waves ==
  let level = 1, spawnBudget = 0, spawnTimer = 0, groupIndex = 0, levelBanner = 0, levelBonus = 0;
  const levelSpeed = () => Math.min(1 + 0.07 * (level - 1), 1.8);
  function startLevel() { spawnBudget = 8 + 4 * level; spawnTimer = 0.6; groupIndex = 0; levelBanner = 1.2; levelBonus = 250 * Math.max(0, level - 1); if (levelBonus) { score += levelBonus; spawnText(200, 270, `LEVEL ${level}  +${levelBonus}`, CFG.colors.pale, 22); } }
  function spawnEnemy(type, x, y, delay) {
    const e = alloc(enemies); if (!e) return false;
    const m = levelSpeed(); e.active = true; e.type = type; e.x = x; e.y = -30; e.baseX = x; e.targetY = y; e.delay = delay || 0; e.spawnT = -e.delay / CFG.enemy.spawnAnim; e.t = 0; e.vx = 0; e.vy = 0; e.flashT = 0; e.fireT = type === 3 ? CFG.enemy.eliteFire : CFG.enemy.basicFire * rand(0.6, 1.2); e.diveX = player.x; e.r = type === 3 ? 20 : type === 1 ? 13 : 12; e.score = type === 3 ? 500 : type === 2 ? 200 : type === 1 ? 150 : 100; e.maxHp = type === 3 ? 6 + level : (type === 0 ? 1 : 2) + Math.floor((level - 1) / 3); e.hp = e.maxHp; e.vy = (type === 0 ? rand(90, 130) : type === 1 ? 80 : type === 3 ? 50 : 100) * m; return true;
  }
  function spawnGroup() {
    if (spawnBudget <= 0) return;
    const maxGroup = Math.min(3 + Math.floor(level / 2), 6); const count = Math.min(maxGroup, spawnBudget); const mode = groupIndex++ % 4;
    const elite = level >= 2 && Math.random() < Math.min(0.05 + 0.03 * level, 0.25) && count >= 3;
    for (let i = 0; i < count; i++) {
      let type = mode === 1 ? 1 : mode === 2 ? 2 : 0; if (elite && i === 0) type = 3;
      let x = 45 + (i * (310 / Math.max(1, count - 1))); let y = 85 + (mode === 1 ? Math.abs(i - (count - 1) / 2) * 22 : 0);
      if (mode === 2) x = 90 + (i % 2) * 220; if (mode === 3) x = i % 2 ? 350 - i * 22 : 50 + i * 22;
      if (type === 3) x = 200;
      spawnEnemy(type, clamp(x, 28, 372), y, i * 0.12);
    }
    spawnBudget -= count; spawnTimer = Math.max(2.4 - 0.12 * level, 1.4);
  }
  function updateSpawner(dt) {
    if (spawnBudget > 0) { spawnTimer -= dt; if (spawnTimer <= 0) spawnGroup(); }
    let living = false; for (let i = 0; i < enemies.length; i++) if (enemies[i].active) { living = true; break; }
    if (spawnBudget <= 0 && !living && levelBanner <= 0) { level++; startLevel(); }
    levelBanner = Math.max(0, levelBanner - dt);
  }

  // == 8. FX (particles, shake, hitstop, floating text) ==
  let hitstopT = 0, trauma = 0, shakeClock = 0;
  const addHitstop = t => { hitstopT = Math.max(hitstopT, t); };
  const addShake = t => { trauma = Math.min(1, trauma + t); };
  function spawnExplosion(x, y, scale, hue, dramatic) {
    const colors = hue === 'elite' ? [CFG.colors.magenta, '#ff77e9', CFG.colors.white] : [CFG.colors.orange, CFG.colors.gold, CFG.colors.pale];
    spawnParticle(x, y, 0, 0, dramatic ? 0.3 : 0.18, dramatic ? 32 : 18, CFG.colors.white, 3, 0);
    spawnParticle(x, y, 0, 0, dramatic ? 0.5 : 0.3, dramatic ? 48 : 34, colors[0], 4, 0);
    const n = Math.round((dramatic ? 14 : 11) * scale);
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = rand(180, 300) * scale; spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.25, 0.45), rand(1.5, 2.5), pick(colors), 0, 0); }
    for (let i = 0; i < Math.round(9 * scale); i++) { const a = Math.random() * Math.PI * 2, s = rand(60, 140) * scale; spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.5, 0.9), rand(3, 5), pick(colors), 1, 3); }
    for (let i = 0; i < Math.round(5 * scale); i++) { const a = Math.random() * Math.PI * 2, s = rand(20, 50) * scale; spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.8, 1.2), rand(8, 16), CFG.colors.smoke, 2, 3); }
  }
  function spawnPickupFx(x, y, color, label) {
    spawnParticle(x, y, 0, -50, 0.55, 3, color, 4, 0);
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; spawnParticle(x, y, Math.cos(a) * 70, Math.sin(a) * 70, 0.35, 2, color, 0, 0); }
    spawnText(x, y - 12, label, color, 15);
  }
  function updateFx(dt) {
    trauma = Math.max(0, trauma - 2.2 * dt); shakeClock += dt;
    for (let i = 0; i < particles.length; i++) if (particles[i].active) { const p = particles[i]; p.life -= dt; if (p.life <= 0) p.active = false; else { p.vx *= Math.exp(-p.drag * dt); p.vy *= Math.exp(-p.drag * dt); p.x += p.vx * dt; p.y += p.vy * dt; } }
    for (let i = 0; i < floatTexts.length; i++) if (floatTexts[i].active) { const f = floatTexts[i]; f.life -= dt; if (f.life <= 0) f.active = false; else { f.y += f.vy * dt; f.scale = lerp(1, f.scale, Math.max(0, f.life / f.maxLife)); } }
  }
  function drawFx() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < particles.length; i++) if (particles[i].active) { const p = particles[i], a = clamp(p.life / p.maxLife, 0, 1); ctx.globalAlpha = a; ctx.strokeStyle = p.color; ctx.fillStyle = p.color;
      if (p.kind === 0) { ctx.lineWidth = p.size; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.018, p.y - p.vy * 0.018); ctx.stroke(); }
      else if (p.kind === 1) { ctx.shadowColor = p.color; ctx.shadowBlur = p.size * 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
      else if (p.kind === 2) { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = p.color; ctx.globalAlpha = a * 0.25; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.2 - a * .2), 0, Math.PI * 2); ctx.fill(); ctx.globalCompositeOperation = 'lighter'; }
      else if (p.kind === 3) { ctx.globalAlpha = a; ctx.shadowColor = p.color; ctx.shadowBlur = p.size; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
      else { ctx.lineWidth = 1.5; ctx.globalAlpha = a * 0.8; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.1 - a), 0, Math.PI * 2); ctx.stroke(); }
    }
    ctx.restore(); ctx.globalAlpha = 1;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < floatTexts.length; i++) if (floatTexts[i].active) { const f = floatTexts[i], a = clamp(f.life / f.maxLife, 0, 1); ctx.globalAlpha = a; ctx.font = `bold ${f.size * f.scale}px system-ui, sans-serif`; ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillText(f.str, f.x + 1, f.y + 1); ctx.fillStyle = f.color; ctx.fillText(f.str, f.x, f.y); }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  // == 9. Starfield ==
  const stars = [{ count: 70, speed: 20, size: 1, alpha: 0.5, data: [] }, { count: 45, speed: 45, size: 1.5, alpha: 0.75, data: [] }, { count: 25, speed: 90, size: 2, alpha: 1, data: [] }];
  for (let l = 0; l < stars.length; l++) for (let i = 0; i < stars[l].count; i++) stars[l].data.push({ x: Math.random() * 400, y: Math.random() * 700, phase: Math.random() * 6.28 });
  let starClock = 0;
  function updateStars(dt, ambience) { starClock += dt * (ambience ? 0.4 : 1); for (let l = 0; l < stars.length; l++) for (let i = 0; i < stars[l].data.length; i++) { const s = stars[l].data[i]; s.y = (s.y + stars[l].speed * dt * (ambience ? 0.4 : 1)) % 700; } }
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, CFG.colors.bg0); g.addColorStop(1, CFG.colors.bg1); ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 700);
    const neb = ctx.createRadialGradient(80, 230, 4, 80, 230, 230); neb.addColorStop(0, 'rgba(35,70,160,.16)'); neb.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = neb; ctx.fillRect(0, 0, 400, 700);
    const neb2 = ctx.createRadialGradient(350, 490, 5, 350, 490, 260); neb2.addColorStop(0, 'rgba(120,20,120,.11)'); neb2.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = neb2; ctx.fillRect(0, 0, 400, 700);
    for (let l = 0; l < stars.length; l++) { const layer = stars[l]; ctx.fillStyle = CFG.colors.white; for (let i = 0; i < layer.data.length; i++) { const s = layer.data[i], a = layer.alpha * (0.7 + 0.3 * Math.sin(starClock * 2 + s.phase)); ctx.globalAlpha = a; ctx.fillRect(s.x, s.y, layer.size, layer.size); if (l === 2) { ctx.globalAlpha = a * 0.35; ctx.fillRect(s.x, s.y - 7, 1, 7); } } }
    ctx.globalAlpha = 1;
  }

  // == 10. States & screens ==
  const STATES = { START: 'START', PLAYING: 'PLAYING', GAME_OVER: 'GAME_OVER' };
  let state = STATES.START, transition = { active: false, t: 0, target: null, swapped: false }, clock = 0, gameOverDelay = 0, finalScore = 0;
  function resetGame() {
    deactivateAll(bullets); deactivateAll(eBullets); deactivateAll(enemies); deactivateAll(powerUps); deactivateAll(particles); deactivateAll(floatTexts);
    resetPlayer(); score = 0; combo = 0; multiplier = 1; comboT = 0; level = 1; spawnBudget = 0; spawnTimer = 0; groupIndex = 0; levelBanner = 0; hitstopT = 0; trauma = 0; gameOverDelay = 0; startLevel(); clearInput();
  }
  function beginTransition(target) {
    if (transition.active) return;
    transition.active = true; transition.t = 0; transition.target = target; transition.swapped = false; clearInput();
  }
  function setState(next) { if (next !== state) beginTransition(next); }
  function updateTransition(dt) {
    if (!transition.active) return;
    transition.t += dt;
    if (!transition.swapped && transition.t >= 0.3) { transition.swapped = true; state = transition.target; if (state === STATES.PLAYING) resetGame(); }
    if (transition.t >= 0.6) { transition.active = false; transition.t = 0; }
  }
  function drawTransition() { if (!transition.active) return; const fade = transition.t < 0.3 ? transition.t / 0.3 : 1 - (transition.t - 0.3) / 0.3; ctx.fillStyle = `rgba(2,2,12,${clamp(fade, 0, 1)})`; ctx.fillRect(0, 0, 400, 700); }
  function drawStart() {
    ctx.fillStyle = 'rgba(3,3,18,.43)'; ctx.fillRect(0, 0, 400, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = CFG.colors.cyan; ctx.shadowBlur = 18; ctx.fillStyle = CFG.colors.pale; ctx.font = 'bold 38px system-ui, sans-serif'; ctx.fillText('GALAXY', 200, 210 + Math.sin(clock * 2) * 3); ctx.fillStyle = CFG.colors.cyan; ctx.fillText('SHOOTER', 200, 252 + Math.sin(clock * 2) * 3); ctx.shadowBlur = 0;
    ctx.fillStyle = '#7694c7'; ctx.font = '14px system-ui, sans-serif'; ctx.fillText('NEON FRONTIER // SECTOR 07', 200, 290);
    const pulse = 0.72 + Math.sin(clock * 4) * 0.2; ctx.globalAlpha = pulse; ctx.fillStyle = CFG.colors.white; ctx.font = 'bold 19px system-ui, sans-serif'; ctx.fillText('PRESS SPACE / ENTER TO START', 200, 385); ctx.font = '15px system-ui, sans-serif'; ctx.fillStyle = CFG.colors.pale; ctx.fillText('TAP TO START', 200, 415); ctx.globalAlpha = 1;
    ctx.fillStyle = '#91a7ce'; ctx.font = '13px system-ui, sans-serif'; ctx.fillText('ARROWS / WASD  •  STEER', 200, 500); ctx.fillText('SPACE  •  MANUAL FIRE', 200, 525); ctx.fillText('DRAG  •  MOVE    TAP  •  FIRE', 200, 550);
  }
  function drawGameOver() {
    ctx.fillStyle = 'rgba(3,3,18,.7)'; ctx.fillRect(0, 0, 400, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = CFG.colors.magenta; ctx.shadowBlur = 18; ctx.fillStyle = '#ff9beb'; ctx.font = 'bold 34px system-ui, sans-serif'; ctx.fillText('GAME OVER', 200, 245); ctx.shadowBlur = 0;
    ctx.fillStyle = '#91a7ce'; ctx.font = '13px system-ui, sans-serif'; ctx.fillText('FINAL SCORE', 200, 302); ctx.fillStyle = CFG.colors.white; ctx.font = 'bold 30px monospace'; ctx.fillText(fmt(finalScore), 200, 340);
    const pulse = 0.75 + Math.sin(clock * 4) * 0.2; ctx.globalAlpha = pulse; ctx.fillStyle = CFG.colors.pale; ctx.font = 'bold 17px system-ui, sans-serif'; ctx.fillText('PRESS SPACE / ENTER TO RESTART', 200, 420); ctx.font = '15px system-ui, sans-serif'; ctx.fillText('TAP TO RESTART', 200, 450); ctx.globalAlpha = 1;
  }

  // == 11. HUD ==
  let score = 0, combo = 0, multiplier = 1, comboT = 0;
  function drawHud() {
    ctx.save(); ctx.font = 'bold 16px monospace'; ctx.textBaseline = 'top'; ctx.fillStyle = CFG.colors.hud; ctx.shadowColor = CFG.colors.cyan; ctx.shadowBlur = 8; ctx.fillText(fmt(score), 14, 12); ctx.textAlign = 'center'; ctx.fillText(`LV ${level}`, 200, 12); ctx.textAlign = 'right'; ctx.fillText('LIVES', 346, 12); ctx.shadowBlur = 0;
    for (let i = 0; i < player.lives; i++) { ctx.save(); ctx.translate(358 + i * 11, 29); ctx.scale(.35, .35); ctx.fillStyle = CFG.colors.cyan; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(8, 10); ctx.lineTo(0, 7); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill(); ctx.restore(); }
    ctx.textAlign = 'left'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.fillStyle = combo > 0 ? CFG.colors.gold : '#66749d'; ctx.fillText(combo > 0 ? `x${multiplier} COMBO` : 'COMBO READY', 14, 42); ctx.fillStyle = 'rgba(70,100,150,.35)'; ctx.fillRect(14, 60, 62, 3); if (comboT > 0) { ctx.fillStyle = CFG.colors.gold; ctx.fillRect(14, 60, 62 * comboT / 2.5, 3); }
    ctx.fillStyle = player.shield ? CFG.colors.cyan : '#34405d'; ctx.beginPath(); ctx.arc(20, 674, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#8297c0'; ctx.font = '11px system-ui, sans-serif'; ctx.fillText('SHIELD', 30, 669);
    if (player.rapidT > 0) { ctx.fillStyle = '#ffe66d'; ctx.fillText(`RAPID ${player.rapidT.toFixed(1)}`, 112, 669); ctx.fillStyle = 'rgba(255,230,109,.25)'; ctx.fillRect(112, 686, 70, 3); ctx.fillStyle = '#ffe66d'; ctx.fillRect(112, 686, 70 * player.rapidT / 8, 3); }
    ctx.fillStyle = '#83eaa0'; ctx.fillText(`SPREAD ${player.spreadLv ? '●●●' : '○'}`, 220, 669); ctx.restore();
    if (levelBanner > 0) { const a = Math.min(1, levelBanner / .3, (1.2 - levelBanner) / .3); ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 30px system-ui, sans-serif'; ctx.fillStyle = CFG.colors.pale; ctx.shadowColor = CFG.colors.cyan; ctx.shadowBlur = 20; ctx.fillText(`LEVEL ${level}`, 200, 330); ctx.restore(); }
  }

  // == 12. update/render + main loop ==
  function fireEnemy(e) {
    const b = alloc(eBullets); if (!b) return; const dx = player.x - e.x, dy = player.y - e.y, len = Math.hypot(dx, dy) || 1, speed = (e.type === 3 ? 240 : 200) * levelSpeed(); b.active = true; b.x = e.x; b.y = e.y + 14; b.vx = dx / len * speed; b.vy = dy / len * speed; b.r = 5;
  }
  function updateEnemies(dt) {
    const m = levelSpeed();
    for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (!e.active) continue; e.flashT = Math.max(0, e.flashT - dt); e.spawnT += dt / CFG.enemy.spawnAnim;
      if (e.spawnT < 0) continue;
      if (e.spawnT < 1) { const q = easeOut(e.spawnT); e.y = lerp(-30, e.targetY, q); continue; }
      e.t += dt; if (e.type === 0) e.y += e.vy * dt; else if (e.type === 1) { e.y += e.vy * dt; e.x = e.baseX + Math.sin(e.t * 3) * 60; } else if (e.type === 2) { if (e.t < 1.2) e.y += e.vy * dt; else { if (e.t < 1.2 + 0.02) e.diveX = player.x; e.x = approach(e.x, e.diveX, 260 * m * dt); e.y += 260 * m * dt; } } else { e.y += e.vy * dt; e.x = e.baseX + Math.sin(e.t * 1.7) * 52; }
      if (e.y > 735 || e.x < -50 || e.x > 450) { e.active = false; continue; }
      e.fireT -= dt; if (e.spawnT >= 1 && e.fireT <= 0) { if (e.type === 3 || (level >= 3 && e.type < 2 && Math.random() < .2)) fireEnemy(e); e.fireT = e.type === 3 ? CFG.enemy.eliteFire : CFG.enemy.basicFire; }
    }
  }
  function updateBullets(dt) {
    const steps = clamp(Math.ceil(dt / (1 / 60)), 1, 3), sub = dt / steps;
    for (let s = 0; s < steps; s++) {
      for (let i = 0; i < bullets.length; i++) { const b = bullets[i]; if (!b.active) continue; b.x += b.vx * sub; b.y += b.vy * sub; if (b.y < -20 || b.x < -30 || b.x > 430) { b.active = false; continue; }
        for (let j = 0; j < enemies.length; j++) { const e = enemies[j]; if (!e.active || e.spawnT < 0) continue; if (hit(b, e, 0)) { b.active = false; e.hp -= b.dmg; e.flashT = .12; spawnParticle(b.x, b.y, 0, 0, .06, 5, CFG.colors.white, 3, 0); if (e.hp <= 0) killEnemy(e); break; } }
      }
    }
  }
  function updateEnemyBullets(dt) {
    for (let i = 0; i < eBullets.length; i++) { const b = eBullets[i]; if (!b.active) continue; b.x += b.vx * dt; b.y += b.vy * dt; if (b.y > 720 || b.x < -20 || b.x > 420) { b.active = false; continue; } if (player.alive && player.invulnT <= 0 && hit(b, player, 0)) { b.active = false; hurtPlayer(b.x, b.y); } }
  }
  function drawProjectile(b, enemyShot) {
    const color = enemyShot ? CFG.colors.enemyShot : CFG.colors.cyan; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = color; ctx.lineWidth = enemyShot ? 3 : 4; ctx.globalAlpha = .22; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .025, b.y - b.vy * .025); ctx.stroke(); ctx.globalAlpha = 1; ctx.shadowColor = color; ctx.shadowBlur = 10;
    if (enemyShot) { const g = ctx.createRadialGradient(b.x - 1, b.y - 1, 1, b.x, b.y, 8); g.addColorStop(0, '#fff'); g.addColorStop(.25, color); g.addColorStop(1, 'rgba(255,77,166,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI * 2); ctx.fill(); } else { ctx.strokeStyle = CFG.colors.pale; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.x, b.y + 7); ctx.lineTo(b.x, b.y - 7); ctx.stroke(); ctx.strokeStyle = CFG.colors.white; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore();
  }
  function drawEnemy(e) {
    if (e.spawnT < 0) return; const entrance = e.spawnT < 1 ? easeOut(e.spawnT) : 1; ctx.save(); ctx.globalAlpha = entrance; ctx.translate(e.x, e.y); ctx.scale(.3 + .7 * entrance, .3 + .7 * entrance); const elite = e.type === 3, color = elite ? CFG.colors.magenta : e.type === 1 ? CFG.colors.gold : CFG.colors.orange;
    ctx.globalCompositeOperation = 'lighter'; ctx.shadowColor = color; ctx.shadowBlur = elite ? 18 : 10; ctx.strokeStyle = color; ctx.lineWidth = elite ? 5 : 4; ctx.beginPath(); ctx.moveTo(0, elite ? -20 : -14); ctx.lineTo(elite ? 22 : 15, elite ? 12 : 10); ctx.lineTo(0, elite ? 6 : 12); ctx.lineTo(elite ? -22 : -15, elite ? 12 : 10); ctx.closePath(); ctx.stroke(); ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0, -15, 0, 15); g.addColorStop(0, elite ? '#ff9cf0' : '#ffc069'); g.addColorStop(1, elite ? '#6b175f' : '#732b25'); ctx.fillStyle = e.flashT > 0 ? '#fff' : g; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke(); ctx.fillStyle = elite ? '#fff' : '#ffdca1'; ctx.beginPath(); ctx.arc(0, -3, elite ? 5 : 3, 0, Math.PI * 2); ctx.fill();
    if (elite) { ctx.strokeStyle = '#ffb4f3'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 25, Math.PI, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }
  function killEnemy(e, noCombo) {
    e.active = false; const elite = e.type === 3; spawnExplosion(e.x, e.y, elite ? 1.5 : 1, elite ? 'elite' : 'warm', false); addShake(elite ? CFG.shake.elite : CFG.shake.standard); addHitstop(elite ? CFG.hitstop.elite : CFG.hitstop.standard);
    if (!noCombo) { if (comboT <= 0) combo = 0; combo++; const old = multiplier; multiplier = Math.min(1 + Math.floor(combo / 4), 8); comboT = 2.5; const value = e.score * multiplier; score += value; spawnText(e.x, e.y, `+${value}`, elite ? '#ff9beb' : CFG.colors.gold, elite ? 19 : 16); if (multiplier > old) spawnText(200, 150, `COMBO x${multiplier}!`, CFG.colors.pale, 23); }
    else { score += e.score; spawnText(e.x, e.y, `+${e.score}`, CFG.colors.white, 15); }
    if (!noCombo && Math.random() < (elite ? .35 : .12) && activePowerups() < 2) spawnPowerUp(e.x, e.y);
  }
  function hurtPlayer(sx, sy) {
    if (!player.alive || player.invulnT > 0) return;
    if (player.shield) { player.shield = false; player.invulnT = .8; spawnPickupFx(player.x, player.y, CFG.colors.cyan, 'SHIELD BREAK'); addShake(.2); addHitstop(.045); return; }
    player.lives--; player.invulnT = 2; player.flashT = .2; const dx = player.x - sx, dy = player.y - sy, len = Math.hypot(dx, dy) || 1; player.vx += dx / len * 140; player.vy += dy / len * 140 + 80; addShake(player.lives <= 0 ? CFG.shake.death : CFG.shake.player); addHitstop(player.lives <= 0 ? CFG.hitstop.death : CFG.hitstop.player); spawnParticle(player.x, player.y, 0, 0, .15, 22, CFG.colors.white, 3, 0); spawnText(player.x, player.y - 30, '-1 LIFE', '#ff90bf', 16);
    if (player.lives <= 0) { player.alive = false; finalScore = score; spawnExplosion(player.x, player.y, 2.5, 'elite', true); gameOverDelay = .8; }
  }
  function updateCollisions() {
    if (!player.alive) return;
    for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (e.active && e.spawnT >= 1 && hit(e, player, -2)) { e.active = false; spawnExplosion(e.x, e.y, 1, e.type === 3 ? 'elite' : 'warm', false); if (player.invulnT <= 0) hurtPlayer(e.x, e.y); return; } }
  }

  // == 13. Power-ups ==
  const powerTypes = [{ name: 'SPREAD!', color: '#83eaa0', glyph: 'S' }, { name: 'RAPID!', color: '#ffe66d', glyph: 'R' }, { name: 'SHIELD!', color: CFG.colors.cyan, glyph: '◇' }, { name: 'NOVA!', color: CFG.colors.white, glyph: 'B' }, { name: '1UP!', color: '#ff8fca', glyph: '+' }];
  function activePowerups() { let n = 0; for (let i = 0; i < powerUps.length; i++) if (powerUps[i].active) n++; return n; }
  function spawnPowerUp(x, y) { const p = alloc(powerUps); if (!p) return; p.active = true; p.x = x; p.y = y; p.vy = 60; p.vx = 0; p.type = (Math.random() * powerTypes.length) | 0; p.t = 0; p.life = 9; p.r = 12; }
  function updatePowerUps(dt) {
    for (let i = 0; i < powerUps.length; i++) { const p = powerUps[i]; if (!p.active) continue; p.t += dt; p.life -= dt; if (p.life <= 0 || p.y > 730) { p.active = false; continue; } const dx = player.x - p.x, dy = player.y - p.y, d = Math.hypot(dx, dy); if (d < 90) { p.vx = approach(p.vx, dx / (d || 1) * 300, 500 * dt); p.vy = approach(p.vy, 60 + dy / (d || 1) * 300, 500 * dt); } else p.vx = Math.sin(p.t * 2.5) * 18; p.x += p.vx * dt; p.y += p.vy * dt; if (player.alive && hit(p, player, 0)) { p.active = false; collectPowerUp(p.type); } }
  }
  function collectPowerUp(type) { const p = powerTypes[type]; if (type === 0) { if (player.spreadLv) score += 500; else player.spreadLv = 1; } else if (type === 1) player.rapidT = 8; else if (type === 2) player.shield = true; else if (type === 3) { for (let i = 0; i < enemies.length; i++) if (enemies[i].active && enemies[i].spawnT >= 1) killEnemy(enemies[i], true); deactivateAll(eBullets); addShake(CFG.shake.bomb); addHitstop(CFG.hitstop.bomb); } else player.lives = Math.min(5, player.lives + 1); player.pickupT = .15; player.pickupColor = p.color; spawnPickupFx(player.x, player.y, p.color, p.name); }
  function drawPowerUp(p) { const data = powerTypes[p.type]; if (p.life < 2 && ((p.life * 8) | 0) % 2 === 0) return; const bob = Math.sin(p.t * 6) * 3, pulse = .7 + .3 * Math.sin(p.t * 6); ctx.save(); ctx.translate(p.x, p.y + bob); ctx.rotate(p.t * 1.5); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = pulse; ctx.shadowColor = data.color; ctx.shadowBlur = 15; ctx.strokeStyle = data.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.rotate(-p.t * 3); ctx.fillStyle = data.color; ctx.font = 'bold 13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(data.glyph, 0, 0); ctx.restore(); }

  function updateWorld(dt) {
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; multiplier = 1; } }
    updatePlayer(dt); updateSpawner(dt); updateEnemies(dt); updateBullets(dt); updateEnemyBullets(dt); updatePowerUps(dt); updateCollisions(); updateFx(dt);
    if (!player.alive) { gameOverDelay -= dt; if (gameOverDelay <= 0) beginTransition(STATES.GAME_OVER); }
  }
  function renderWorld() {
    const trauma2 = trauma * trauma, sx = trauma2 * 12 * Math.sin(shakeClock * 37.1), sy = trauma2 * 12 * Math.cos(shakeClock * 43.7); ctx.save(); ctx.translate(sx, sy);
    for (let i = 0; i < powerUps.length; i++) if (powerUps[i].active) drawPowerUp(powerUps[i]);
    for (let i = 0; i < enemies.length; i++) if (enemies[i].active) drawEnemy(enemies[i]);
    for (let i = 0; i < bullets.length; i++) if (bullets[i].active) drawProjectile(bullets[i], false);
    for (let i = 0; i < eBullets.length; i++) if (eBullets[i].active) drawProjectile(eBullets[i], true);
    drawPlayer(); drawFx(); ctx.restore();
  }
  function update(dt) {
    clock += dt; updateStars(dt, state !== STATES.PLAYING); updateTransition(dt);
    if (state === STATES.PLAYING && !transition.active) { if (hitstopT > 0) { hitstopT = Math.max(0, hitstopT - dt); updateFx(dt * .25); } else updateWorld(dt); }
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, CFG.W, CFG.H); drawBackground();
    if (state === STATES.PLAYING || state === STATES.GAME_OVER) renderWorld();
    if (state === STATES.PLAYING) drawHud(); else if (state === STATES.START) drawStart(); else drawGameOver(); drawTransition();
  }
  let last = performance.now();
  function frame(now) { const dt = clamp((now - last) / 1000, 0, 0.05); last = now; update(dt); render(); requestAnimationFrame(frame); }
  resetPlayer(); requestAnimationFrame(frame);
})();
</script>
